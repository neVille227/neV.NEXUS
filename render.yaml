# Blueprint Render — neV.NEXUS LIFE DIGITAL (pilote). Plans gratuits.
databases:
  - name: nevnexus-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: nevnexus_db
    user: nevnexus_db_user
services:
  - type: web
    name: nevnexus
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: nevnexus-db
          property: connectionString
      - key: REGISTRATION_MODE
        value: invite
      - key: INVITE_CODE
        generateValue: true
